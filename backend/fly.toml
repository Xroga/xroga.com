# fly.toml app configuration file for xroga-api
#
# NOT the deploy path. Production deploys use /fly.api.toml via
# .github/workflows/fly-deploy.yml. Deploying with this file instead rolls the
# app machines onto the [env] below, which is missing the OAuth callback and
# Lemon Squeezy variables that fly.api.toml sets — see that file before
# changing anything here.

app = 'xroga-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  NODE_ENV = 'production'
  FRONTEND_URL = 'https://xroga.com'
  RUN_SWARM_WORKER = 'true'
  SWARM_WORKER_CONCURRENCY = '2'
  GPU_ENABLED = 'false'

[processes]
  app = 'node dist/index.js'
  # No `worker` group. Fly execs a process command directly rather than through
  # a shell, so a `VAR=value node ...` prefix is read as the script path: a
  # worker defined that way died with
  #   Error: Cannot find module '/app/RUN_SWARM_WORKER=true'
  # and crash-looped to its max restart count. RUN_SWARM_WORKER is already set
  # in [env] above, so a worker group would need only 'node dist/index.js' —
  # but fly.api.toml intentionally runs no worker, so none is defined here.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    grace_period = '30s'
    interval = '15s'
    method = 'GET'
    timeout = '10s'
    path = '/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2

# GPU worker for ComfyUI — scale separately when COMFYUI_URL is configured
