<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Locking buttons</title></head>
<body>
<h1>Locking buttons</h1>
<p><button type="button" id="send" onclick="this.disabled = true; document.getElementById('s').textContent = 'Sent'">Send once</button></p>
<p><button type="button" id="noop">Do nothing</button></p>
<p id="s" role="status"></p>
</body></html>
