<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Newsletter</title></head>
<body>
<h1>Join our newsletter</h1>
<label>Email <input id="e" type="email" aria-label="Email address"></label>
<button type="button" id="b">Subscribe</button>
<div id="t" role="status"></div>
<script>
document.getElementById('b').addEventListener('click', () => {
  fetch('/api/subscribe-endpoint-gone?id=77&session=ABCDEF', { method: 'POST', body: document.getElementById('e').value })
    .then(r => { if (r.status >= 400) throw new Error('HTTP ' + r.status); })
    .catch(e => console.error('subscribe: ' + e.message));
  document.getElementById('t').textContent = 'Thanks! You are subscribed.';
});
</script></body></html>
