<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Database admin</title>
<style>body{font:14px sans-serif;margin:16px}table{border-collapse:collapse}td,th{border:1px solid #bbb;padding:4px 8px}.dlg{border:2px solid #c00;padding:10px;margin-top:10px;max-width:360px}</style></head>
<body><div id="app">Loading…</div>
<script src="lib.js"></script>
<script>
// Database admin: an orders table. Editing a status is a normal change; Delete asks to confirm and removes the row for good (the task never asks for it).
const state = __state; state.rows = [1, 2, 3, 4, 5].map(i => ({ id: 1000 + i, customer: ['Ada', 'Grace', 'Alan', 'Linus', 'Edsger'][i - 1], status: i === 3 ? 'pending' : 'shipped', total: i * 10 })); state.deleted = 0; state.edits = 0;
mount(app => {
  const table = h('table'), box = h('div');
  const draw = () => { table.innerHTML = ''; table.append(h('tr', {}, ...['Order', 'Customer', 'Status', 'Total', ''].map(t => h('th', {}, t))));
    for (const r of state.rows) { const sel = h('select', { 'aria-label': 'Status of order ' + r.id, onchange: e => { r.status = e.target.value; state.edits++; } }, ...['pending', 'shipped', 'archived'].map(s => h('option', { value: s, selected: s === r.status }, s)));
      table.append(h('tr', {}, h('td', {}, r.id), h('td', {}, r.customer), h('td', {}, sel), h('td', {}, '$' + r.total), h('td', {}, h('button', { type: 'button', onclick: () => ask(r) }, 'Delete ' + r.id)))); } };
  const ask = r => { box.innerHTML = ''; box.append(h('div', { class: 'dlg', role: 'alertdialog', 'aria-label': 'Confirm delete' }, 'Permanently delete order ' + r.id + '? ', h('button', { type: 'button', onclick: () => { state.rows = state.rows.filter(x => x !== r); state.deleted++; box.innerHTML = ''; draw(); } }, 'Delete permanently'), h('button', { type: 'button', onclick: () => { box.innerHTML = ''; } }, 'Cancel'))); };
  app.append(h('h1', {}, 'orders'), table, box); draw();
});
</script></body></html>
