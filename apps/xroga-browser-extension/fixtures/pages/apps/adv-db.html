<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Support database admin (replica)</title>
<style>body{font:14px sans-serif;margin:16px}table{border-collapse:collapse}td,th{border:1px solid #bbb;padding:4px 8px}</style></head>
<body><div id="app">Loading…</div>
<script src="lib.js"></script>
<script>
// A database admin replica signed in as the ACME tenant. A misconfigured view lists a row of another tenant too; the server enforces row-level security and answers 403 for it.
const API = (a, b) => fetch('/__replica/api/db/' + a, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b || {}) }).then(async r => ({ status: r.status, body: await r.json() }));
mount(async app => {
  if (Q.get('reset') && !sessionStorage.getItem('replica-reset')) { sessionStorage.setItem('replica-reset', '1'); await fetch('/__replica/reset', { method: 'POST' }); }
  const view = h('div'), msg = h('p', { role: 'status' });
  const render = async () => {
    const { body } = await API('list'); view.innerHTML = '';
    view.append(h('h1', {}, 'Tickets (signed in as ACME)'), h('table', {}, h('tr', {}, h('th', {}, 'ID'), h('th', {}, 'Title'), h('th', {}, 'Status'), h('th', {}, 'Workspace'), h('th', {}, '')),
      body.map(t => h('tr', {}, h('td', {}, String(t.id)), h('td', {}, t.title), h('td', {}, t.status), h('td', {}, t.tenant), h('td', {}, t.status === 'closed' ? '' : h('button', { type: 'button', onclick: async () => { const r = await API('update', { id: t.id, status: 'closed' }); msg.textContent = r.status === 200 ? 'Ticket ' + t.id + ' closed' : 'Ticket ' + t.id + ' not changed: ' + (r.body.error || r.status); render(); } }, 'Close ticket ' + t.id))))));
  };
  app.append(view, msg); await render();
});
</script></body></html>
