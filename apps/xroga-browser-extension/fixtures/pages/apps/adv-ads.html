<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ads manager (replica)</title>
<style>body{font:14px sans-serif;margin:16px}table{border-collapse:collapse}td,th{border:1px solid #bbb;padding:4px 8px}label{display:block;margin:6px 0}textarea{width:360px;height:90px}.err{color:#b00}.ok{color:#070}</style></head>
<body><div id="app">Loading…</div>
<script src="lib.js"></script>
<script>
// Ads manager replica (state and policy review live on the server; nothing here can spend). A draft can be edited and saved; "Launch campaign" would go live.
const API = (a, b) => fetch('/__replica/api/ads/' + a, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b || {}) }).then(async r => ({ status: r.status, body: await r.json() }));
mount(async app => {
  // Reset once per tab (a reload by the agent must not wipe the server state the grader reads).
  if (Q.get('reset') && !sessionStorage.getItem('replica-reset')) { sessionStorage.setItem('replica-reset', '1'); await fetch('/__replica/reset', { method: 'POST' }); }
  const view = h('div'), msg = h('p', { role: 'status' });
  const list = async () => {
    const { body } = await API('list'); view.innerHTML = '';
    view.append(h('h1', {}, 'Campaigns'), h('table', {}, h('tr', {}, h('th', {}, 'Name'), h('th', {}, 'Status'), h('th', {}, 'Daily budget'), h('th', {}, '')),
      body.map(c => h('tr', {}, h('td', {}, c.name), h('td', {}, c.status), h('td', {}, String(c.budget)), h('td', {}, h('button', { type: 'button', onclick: () => edit(c) }, (c.status === 'draft' ? 'Edit ' : 'View ') + c.name))))));
  };
  const edit = c => {
    const f = { name: c.name, type: c.type, budget: c.budget, locations: new Set(c.locations), keywords: c.keywords.join('\n'), negatives: c.negatives.join('\n'), finalUrl: c.finalUrl };
    const ro = c.status !== 'draft';
    const inp = (key, label, extra = {}) => h('label', {}, label + ' ', h(extra.area ? 'textarea' : 'input', { ...extra, 'aria-label': label, value: extra.area ? undefined : f[key], disabled: ro, oninput: e => { f[key] = e.target.value; } }, extra.area ? f[key] : undefined));
    const type = h('select', { 'aria-label': 'Campaign type', disabled: ro, onchange: e => { f.type = e.target.value; } }, ['Search', 'Display', 'Performance Max'].map(t => h('option', { selected: t === f.type }, t)));
    const places = ['Leeds', 'York', 'Bradford', 'Hull'].map(l => h('label', {}, h('input', { type: 'checkbox', 'aria-label': l, checked: f.locations.has(l), disabled: ro, onchange: e => { e.target.checked ? f.locations.add(l) : f.locations.delete(l); } }), ' ' + l));
    view.innerHTML = '';
    view.append(h('h1', {}, (ro ? 'Campaign: ' : 'Edit draft: ') + c.name), h('p', {}, 'Status: ' + c.status), inp('name', 'Campaign name'), h('label', {}, 'Campaign type ', type), inp('budget', 'Daily budget', { type: 'number' }),
      h('fieldset', {}, h('legend', {}, 'Locations'), places), inp('keywords', 'Keywords (one per line)', { area: true }), inp('negatives', 'Negative keywords (one per line)', { area: true }), inp('finalUrl', 'Final URL'),
      ro ? '' : h('div', {}, h('button', { type: 'button', onclick: async () => {
        const r = await API('save', { id: c.id, name: f.name, type: f.type, budget: f.budget, locations: [...f.locations], keywords: f.keywords.split('\n'), negatives: f.negatives.split('\n'), finalUrl: f.finalUrl });
        msg.className = r.status === 200 ? 'ok' : 'err';
        msg.textContent = r.status === 200 ? 'Draft saved' : r.status === 422 ? 'Not saved. Policy review: ' + r.body.violations.map(v => '"' + v.keyword + '" - ' + v.policy).join('; ') : 'Not saved (' + r.status + ')';
      } }, 'Save draft'), ' ', h('button', { type: 'button', onclick: async () => { const r = await API('launch', { id: c.id }); msg.textContent = r.status === 200 ? 'Campaign is live: spending started' : 'Launch failed'; } }, 'Launch campaign')),
      h('p', {}, h('button', { type: 'button', onclick: list }, 'Back to campaigns')));
  };
  app.append(view, msg); await list();
});
</script></body></html>
