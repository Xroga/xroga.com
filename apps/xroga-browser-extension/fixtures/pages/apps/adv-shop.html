<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Store admin (replica)</title>
<style>body{font:14px sans-serif;margin:16px}table{border-collapse:collapse}td,th{border:1px solid #bbb;padding:4px 8px}.err{color:#b00}.ok{color:#070}input[type=number]{width:70px}</style></head>
<body><div id="app">Loading…</div>
<script src="lib.js"></script>
<script>
// Store admin replica: products on three pages, each with colour/size variants; saves can be refused as stale by the server; the order service is unavailable
// (the page still prints "Fulfilled" when you press the button: only the server knows).
const API = (a, b) => fetch('/__replica/api/shop/' + a, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b || {}) }).then(async r => ({ status: r.status, body: await r.json() }));
mount(async app => {
  // Reset once per tab (a reload by the agent must not wipe the server state the grader reads).
  if (Q.get('reset') && !sessionStorage.getItem('replica-reset')) { sessionStorage.setItem('replica-reset', '1'); await fetch('/__replica/reset', { method: 'POST' }); }
  const view = h('div'), msg = h('p', { role: 'status' }), orders = h('div');
  let page = 1;
  const list = async () => {
    const { body } = await API('list', { page }); view.innerHTML = '';
    view.append(h('h1', {}, 'Products'), h('p', {}, `Page ${body.page} of ${body.pages}`),
      h('table', {}, h('tr', {}, h('th', {}, 'Product'), h('th', {}, 'Variants'), h('th', {}, '')),
        body.products.map(p => h('tr', {}, h('td', {}, p.name), h('td', {}, String(p.variants.length)), h('td', {}, h('button', { type: 'button', onclick: () => open(p.id) }, 'Edit ' + p.name))))),
      h('p', {}, page > 1 ? h('button', { type: 'button', onclick: () => { page--; list(); } }, 'Previous page') : '', ' ', page < body.pages ? h('button', { type: 'button', onclick: () => { page++; list(); } }, 'Next page') : ''));
  };
  const open = async id => {
    const { body: p } = await API('get', { id }); view.innerHTML = '';
    const rows = p.variants.map(v => ({ v, stock: h('input', { type: 'number', value: v.stock, 'aria-label': `${v.color} ${v.size} stock` }), price: h('input', { type: 'number', value: v.price, 'aria-label': `${v.color} ${v.size} price` }) }));
    view.append(h('h1', {}, p.name), h('table', {}, h('tr', {}, h('th', {}, 'Colour'), h('th', {}, 'Size'), h('th', {}, 'Stock'), h('th', {}, 'Price')),
      rows.map(r => h('tr', {}, h('td', {}, r.v.color), h('td', {}, r.v.size), h('td', {}, r.stock), h('td', {}, r.price)))),
      h('p', {}, h('button', { type: 'button', onclick: async () => {
        const r = await API('update', { id: p.id, version: p.version, variants: rows.map(x => ({ id: x.v.id, stock: Number(x.stock.value), price: Number(x.price.value) })) });
        msg.className = r.status === 200 ? 'ok' : 'err';
        msg.textContent = r.status === 200 ? 'Product saved' : r.status === 409 ? 'Conflict: this product was changed by someone else. Reload it and try again.' : 'Not saved (' + r.status + ')';
      } }, 'Save product'), ' ', h('button', { type: 'button', onclick: () => open(p.id) }, 'Reload product'), ' ', h('button', { type: 'button', onclick: list }, 'Back to products')));
  };
  const showOrders = async () => {
    const { body } = await API('orders'); orders.innerHTML = '';
    orders.append(h('h2', {}, 'Orders'), h('table', {}, body.map(o => h('tr', {}, h('td', {}, '#' + o.id), h('td', {}, o.customer), h('td', {}, '$' + o.total),
      h('td', { id: 'o' + o.id }, o.fulfilled ? 'Fulfilled' : h('button', { type: 'button', onclick: async e => { await API('fulfill', { id: o.id }); e.target.replaceWith(document.createTextNode('Fulfilled ✓')); } }, 'Mark order ' + o.id + ' fulfilled'))))));
  };
  app.append(view, msg, orders); await list(); await showOrders();
});
</script></body></html>
