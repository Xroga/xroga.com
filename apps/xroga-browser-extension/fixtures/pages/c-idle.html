<!doctype html>
<html><head><meta charset="utf-8"><title>Network idle fixture</title></head>
<body><h1>Loading things</h1><div id="n">0</div>
<script>
  let n = 0;
  const tick = () => { fetch('/c-text.html?x=' + n).then(r => r.text()).then(() => { n++; document.getElementById('n').textContent = String(n); if (n < 5) setTimeout(tick, 300); }); };
  setTimeout(tick, 200);
</script></body></html>
