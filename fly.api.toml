# Deploy from monorepo root:
#   fly deploy . --config fly.api.toml -a xroga-api

app = 'xroga-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.api'
  ignorefile = '.dockerignore'

[env]
  PORT = '8080'
  NODE_ENV = 'production'
  FRONTEND_URL = 'https://xroga.com'
  GITHUB_OAUTH_CALLBACK_URL = 'https://xroga.com/dashboard/integrations/github/callback'
  LEMONSQUEEZY_MODE = 'test'
  LEMONSQUEEZY_STORE_ID = '217480'
  LEMONSQUEEZY_PRODUCT_SPARK = '1231656'

  # Isolation for generated code. Neither value is a secret; the token that authorises them is
  # staged separately as a Fly secret (see .github/workflows/fly-deploy.yml).
  #
  # The app MUST NOT be this one. `FlyMachineSandboxRuntime` refuses a self-targeting
  # configuration outright, because such a machine would boot perfectly and inherit every
  # production secret this API holds.
  XROGA_SANDBOX_FLY_APP = 'xroga-sandbox'

  # Browser verification runs Chromium inside the sandbox, beside the generated application.
  # Version-locked to the Playwright pinned in this repository (1.62.0) — browser builds are
  # tied to an exact Playwright version, and glibc because Playwright does not support Chromium
  # on the musl base the ordinary validation stages use.
  #
  # Applied per execution, so ordinary validation still runs in the small default image.
  # Unsetting this disables browser verification safely: it reports `browser_unavailable`, which
  # never counts as a pass.
  XROGA_SANDBOX_BROWSER_IMAGE = 'mcr.microsoft.com/playwright:v1.62.0-noble'

[processes]
  app = 'node dist/index.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = '30s'
    interval = '15s'
    method = 'GET'
    timeout = '10s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
