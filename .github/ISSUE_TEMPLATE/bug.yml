name: Bug report
description: Report a reproducible Xroga product or developer-tool defect.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private repository content, customer data or security exploit details.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction and affected public surface or commit.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Include sanitized errors, test names or public URLs. Do not paste credentials.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, personal data and private repository content.
          required: true
