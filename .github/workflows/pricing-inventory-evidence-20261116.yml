name: Pricing source-bound inventory diagnostic
on:
  push:
    branches:
      - diagnostics/pricing-inventory-20261116
permissions:
  contents: write
jobs:
  source-audit:
    if: ${{ !contains(github.event.head_commit.message, '[inventory-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pricing release source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a11a03dea897cbd449020639714936f6bad0ff34
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up reviewed Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.21.1'
      - name: Install locked source workspaces
        working-directory: source
        run: npm ci
      - name: Generate source-bound runtime inventory without changing application code
        working-directory: source
        run: |
          node scripts/xroga/runtime-inventory.mjs
          node scripts/xroga/check-runtime-config.mjs
      - name: Checkout diagnostics branch only after untrusted code execution
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: diagnostics/pricing-inventory-20261116
          path: receipt
          persist-credentials: true
      - name: Commit generated evidence to diagnostics branch only
        working-directory: receipt
        run: |
          set -euo pipefail
          mkdir -p docs/xroga
          for name in dependency-inventory.json dependency-inventory.schema.json deployment-topology.md deployment-topology.mmd secret-inventory.md runtime-contract.md; do
            cp "../source/docs/xroga/$name" "docs/xroga/$name"
            git add "docs/xroga/$name"
          done
          git config user.name "Xroga Evidence Bot"
          git config user.email "evidence-bot@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "[inventory-generated] exact pricing runtime inventory provenance"
          git push origin HEAD:diagnostics/pricing-inventory-20261116
