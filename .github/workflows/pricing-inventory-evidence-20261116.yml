name: Pricing source-bound inventory diagnostic
on:
  push:
    branches:
      - diagnostics/pricing-inventory-20261116
permissions:
  contents: write
jobs:
  source-audit:
    if: ${{ !contains(github.event.head_commit.message, '[inventory-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pricing release source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 21aa69299f3001d5750866bce4691aed39bfb2f4
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up reviewed Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.21.1'
      - name: Install locked source workspaces
        working-directory: source
        run: npm ci
      - name: Validate bounded inventories and regenerate provenance-linked requirements
        working-directory: source
        run: |
          node scripts/xroga/inventory.mjs --check
          node scripts/security/audit-egress-callers.mjs
          node scripts/xroga/reconcile-requirements.mjs
          node scripts/xroga/validate-requirements-ledger.mjs
      - name: Checkout diagnostics branch only after untrusted code execution
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: diagnostics/pricing-inventory-20261116
          path: receipt
          persist-credentials: true
      - name: Commit generated evidence to diagnostics branch only
        working-directory: receipt
        run: |
          set -euo pipefail
          mkdir -p docs/xroga/research
          cp ../source/docs/xroga/research/source-manifest.json docs/xroga/research/source-manifest.json
          cp ../source/docs/xroga/requirements-ledger.json docs/xroga/requirements-ledger.json
          cp ../source/docs/xroga/requirements-ledger.schema.json docs/xroga/requirements-ledger.schema.json
          cp ../source/docs/xroga/requirements-ledger.md docs/xroga/requirements-ledger.md
          cp ../source/docs/xroga/feature-coverage.csv docs/xroga/feature-coverage.csv
          cp ../source/docs/xroga/research/source-reconciliation.md docs/xroga/research/source-reconciliation.md
          cp ../source/docs/xroga/repository-candidate-register.md docs/xroga/repository-candidate-register.md
          git add docs/xroga/research/source-manifest.json docs/xroga/requirements-ledger.json docs/xroga/requirements-ledger.schema.json docs/xroga/requirements-ledger.md docs/xroga/feature-coverage.csv docs/xroga/research/source-reconciliation.md docs/xroga/repository-candidate-register.md
          git config user.name "Xroga Evidence Bot"
          git config user.email "evidence-bot@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "[inventory-generated] exact pricing requirements integrity reconciliation"
          git push origin HEAD:diagnostics/pricing-inventory-20261116
