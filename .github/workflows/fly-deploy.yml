name: Retired Fly deployment

# Historical workflow runs remain preserved. New Fly operations are retired.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse retired Fly operations
        run: |
          echo "::error::Fly operations are retired. Follow docs/operations/google-production-migration.md."
          exit 1
