name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy-xroga-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production

    steps:
      - uses: actions/checkout@v5

      # Pinned to an immutable commit to prevent action supply-chain drift.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.49

      - name: Check Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::FLY_API_TOKEN GitHub secret is empty. Create a token at https://fly.io/user/personal_access_tokens and set it in repo Settings → Secrets → Actions."
            exit 1
          fi
          if ! flyctl auth whoami; then
            echo "::error::FLY_API_TOKEN is invalid or expired (token validation failed). Regenerate at https://fly.io/user/personal_access_tokens and update the GitHub secret FLY_API_TOKEN, then re-run this workflow."
            exit 1
          fi

      # Remote builds avoid flaky registry.fly.io docker login 401s in CI.
      - name: Deploy to Fly.io (remote build)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=5
          delay=15
          until flyctl deploy \
            --config fly.api.toml \
            -a xroga-api \
            --remote-only \
            --ha=false; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::flyctl deploy failed after ${max_attempts} attempts. If you see 'token validation error', refresh GitHub secret FLY_API_TOKEN from https://fly.io/user/personal_access_tokens"
              exit 1
            fi
            echo "deploy failed (attempt ${attempt}/${max_attempts}) — retrying in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

      - name: Record deployed release evidence
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl status --app xroga-api --json > fly-release-status.json
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('fly-release-status.json')); console.log(JSON.stringify({commit:process.env.GITHUB_SHA,app:s.Name ?? 'xroga-api',status:s.Status ?? 'unknown'}))"

      - name: Verify health and readiness
        run: |
          set -euo pipefail
          sleep 15
          : > deployment-verification.jsonl
          verify_endpoint() {
            name="$1"
            url="$2"
            body_file="/tmp/${name}.json"
            code=$(curl -sS -o "$body_file" -w '%{http_code}' --max-time 20 "$url" || true)
            node -e "const fs=require('fs'); const body=fs.readFileSync(process.argv[1],'utf8').slice(0,500); console.log(JSON.stringify({check:process.argv[2],url:process.argv[3],status:Number(process.argv[4]||0),body}))" "$body_file" "$name" "$url" "$code" | tee -a deployment-verification.jsonl
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::${name} failed with HTTP ${code}. See deployment-verification artifact for the safe response."
              return 1
            fi
          }
          verify_endpoint liveness "https://xroga-api.fly.dev/health"
          verify_endpoint api_health "https://xroga-api.fly.dev/api/health"
          verify_endpoint readiness "https://xroga-api.fly.dev/ready"
          # Supabase OAuth route should exist after this deploy (401 without user token is OK)
          code=$(curl -s -o /tmp/sb.json -w '%{http_code}' "https://xroga-api.fly.dev/api/supabase/oauth" || true)
          echo "GET /api/supabase/oauth → HTTP $code"
          cat /tmp/sb.json || true
          echo ""
          if [ "$code" = "404" ]; then
            echo "::error::Supabase OAuth route still 404 — deploy may have used an old image"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fly-release-evidence-${{ github.sha }}
          path: |
            fly-release-status.json
            deployment-verification.jsonl
          if-no-files-found: warn
          retention-days: 30
