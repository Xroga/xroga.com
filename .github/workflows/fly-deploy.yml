name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy-xroga-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production

    steps:
      - uses: actions/checkout@v5

      # Pinned to an immutable commit to prevent action supply-chain drift.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.49

      - name: Check Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::FLY_API_TOKEN GitHub secret is empty. Create a token at https://fly.io/user/personal_access_tokens and set it in repo Settings → Secrets → Actions."
            exit 1
          fi
          if ! flyctl auth whoami; then
            echo "::error::FLY_API_TOKEN is invalid or expired (token validation failed). Regenerate at https://fly.io/user/personal_access_tokens and update the GitHub secret FLY_API_TOKEN, then re-run this workflow."
            exit 1
          fi

      # Staged before the deploy so the deploy that ships this code is the one that applies it.
      # Fly's own wording: secrets are staged, not live, until machines are updated — and the
      # deploy below is that update, so there is no separate restart of production.
      #
      # The token is app-scoped to the sandbox app. It never reaches a log: it is passed through
      # the environment into `flyctl secrets set`, and only its *length* is ever checked.
      - name: Stage sandbox isolation token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          XROGA_SANDBOX_FLY_TOKEN: ${{ secrets.XROGA_SANDBOX_FLY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${XROGA_SANDBOX_FLY_TOKEN:-}" ]; then
            # Not fatal. Without it the Fly sandbox provider stays unregistered and browser
            # verification reports `sandbox_unavailable` — incomplete, never a pass. Failing the
            # deploy over an absent optional capability would be worse than shipping without it.
            echo "::warning::XROGA_SANDBOX_FLY_TOKEN is not set for the Production environment. Generated-code isolation and browser verification will report sandbox_unavailable."
            echo "sandbox_token_staged=false"
            exit 0
          fi
          attempt=1
          max_attempts=3
          delay=10
          until flyctl secrets set --stage -a xroga-api \
            XROGA_SANDBOX_FLY_TOKEN="$XROGA_SANDBOX_FLY_TOKEN"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Fly could not stage the sandbox isolation token after ${max_attempts} attempts."
              exit 1
            fi
            echo "secret staging temporarily unavailable (attempt ${attempt}/${max_attempts}); retrying in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
          echo "sandbox_token_staged=true"

      # Remote builds avoid flaky registry.fly.io docker login 401s in CI.
      - name: Deploy to Fly.io (remote build)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          LEMONSQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMONSQUEEZY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          secret_length="${#LEMONSQUEEZY_WEBHOOK_SECRET}"
          if [ "$secret_length" -lt 6 ] || [ "$secret_length" -gt 40 ]; then
            echo "::error::LEMONSQUEEZY_WEBHOOK_SECRET must be present and contain 6 to 40 characters."
            exit 1
          fi
          secret_attempt=1
          secret_max_attempts=3
          secret_delay=10
          until flyctl secrets set --stage -a xroga-api \
            LEMONSQUEEZY_WEBHOOK_SECRET="$LEMONSQUEEZY_WEBHOOK_SECRET"; do
            if [ "$secret_attempt" -ge "$secret_max_attempts" ]; then
              echo "::error::Fly could not stage the verified Lemon webhook secret after ${secret_max_attempts} attempts."
              exit 1
            fi
            echo "secret staging temporarily unavailable (attempt ${secret_attempt}/${secret_max_attempts}); retrying in ${secret_delay}s"
            sleep "$secret_delay"
            secret_attempt=$((secret_attempt + 1))
            secret_delay=$((secret_delay * 2))
          done
          echo "lemon_test_webhook_secret_staged=true"
          attempt=1
          max_attempts=5
          delay=15
          until flyctl deploy \
            --config fly.api.toml \
            -a xroga-api \
            --build-arg XROGA_RELEASE_SHA="$GITHUB_SHA" \
            --remote-only \
            --ha=false; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::flyctl deploy failed after ${max_attempts} attempts. If you see 'token validation error', refresh GitHub secret FLY_API_TOKEN from https://fly.io/user/personal_access_tokens"
              exit 1
            fi
            echo "deploy failed (attempt ${attempt}/${max_attempts}) — retrying in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

      - name: Record deployed release evidence
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl status --app xroga-api --json > fly-release-status.json
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('fly-release-status.json')); console.log(JSON.stringify({commit:process.env.GITHUB_SHA,app:s.Name ?? 'xroga-api',status:s.Status ?? 'unknown'}))"

      - name: Verify health and readiness
        run: |
          set -euo pipefail
          sleep 15
          : > deployment-verification.jsonl
          verify_endpoint() {
            name="$1"
            url="$2"
            body_file="/tmp/${name}.json"
            code=$(curl -sS -o "$body_file" -w '%{http_code}' --max-time 20 "$url" || true)
            node -e "const fs=require('fs'); const body=fs.readFileSync(process.argv[1],'utf8').slice(0,500); console.log(JSON.stringify({check:process.argv[2],url:process.argv[3],status:Number(process.argv[4]||0),body}))" "$body_file" "$name" "$url" "$code" | tee -a deployment-verification.jsonl
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::${name} failed with HTTP ${code}. See deployment-verification artifact for the safe response."
              return 1
            fi
          }
          verify_endpoint liveness "https://xroga-api.fly.dev/health"
          verify_endpoint api_health "https://xroga-api.fly.dev/api/health"
          verify_endpoint readiness "https://xroga-api.fly.dev/ready"
          # Supabase OAuth route should exist after this deploy (401 without user token is OK)
          code=$(curl -s -o /tmp/sb.json -w '%{http_code}' "https://xroga-api.fly.dev/api/supabase/oauth" || true)
          echo "GET /api/supabase/oauth → HTTP $code"
          cat /tmp/sb.json || true
          echo ""
          if [ "$code" = "404" ]; then
            echo "::error::Supabase OAuth route still 404 — deploy may have used an old image"
            exit 1
          fi

      # Readiness wakes an autostopped machine and proves the new application is
      # serving before SSH executes the provider reconciliation command.
      - name: Reconcile Lemon Test Mode webhook
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl ssh console -a xroga-api -C "node dist/scripts/reconcileLemonWebhook.js"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: fly-release-evidence-${{ github.sha }}
          path: |
            fly-release-status.json
            deployment-verification.jsonl
          if-no-files-found: warn
          retention-days: 30
