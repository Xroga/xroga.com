# Builds the production API image from one exact, already-merged commit of main. Branch-only (push to claude/release-image-build):
# no secrets, no cloud credentials, no deployment. Publishes to GitHub's container registry with the built-in token; the Google side
# pulls it through an Artifact Registry remote repository. The commit is pinned below, never "latest".
name: release-image-build
on:
  push:
    branches: ['claude/release-image-build']
    paths: ['.github/workflows/release-image-build.yml']
permissions:
  contents: read
  packages: write
env:
  RELEASE_SHA: 7674dccc24fb632a9e136b5690c92d98d47ad81c
  IMAGE: ghcr.io/xroga/xroga-api-release
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: The checked-out tree is exactly the pinned commit and is reachable from main
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test -f Dockerfile.api
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (source commit baked into the image)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          provenance: false
          build-args: XROGA_RELEASE_SHA=${{ env.RELEASE_SHA }}
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_SHA }}
      - name: Verify the pushed image carries the pinned source commit
        run: |
          docker pull "$IMAGE:$RELEASE_SHA"
          test "$(docker image inspect "$IMAGE:$RELEASE_SHA" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$RELEASE_SHA"
          test "$(docker run --rm --entrypoint node "$IMAGE:$RELEASE_SHA" -e 'process.stdout.write(process.env.XROGA_RELEASE_SHA)')" = "$RELEASE_SHA"
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "image=$IMAGE@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
