name: Backend health verification

# Read-only reachability and health evidence for the launch gate.
#
# The engineering environment cannot reach xroga-api.fly.dev — its egress gateway
# answers 403 to CONNECT — so backend /health and /ready could not be verified from
# there. A GitHub-hosted runner has ordinary internet egress and can, which makes
# this the smallest legitimate vantage point that closes that evidence gap.
#
# Deliberately read-only: two GETs and no credentials. It holds no secret, takes no
# input, mutates nothing, and cannot start a build or spend provider budget. Anything
# that writes belongs in a separate workflow with its own controls.
on:
  workflow_dispatch:
    inputs:
      oci_wrong_workflow:
        description: 'Approved isolated OCI control, skips live health checks'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-health-verification
  cancel-in-progress: false

jobs:
  oci-wrong-workflow:
    if: inputs.oci_wrong_workflow == true && github.repository == 'Xroga/xroga.com' && github.ref == 'refs/heads/codex/xroga-batch-01'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: xroga-phase3-oci-custody
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
      - run: npm ci --workspaces=false
      - name: Require actual OCI wrong-workflow denial
        env:
          XROGA_OCI_FEDERATION_DOMAIN: ${{ vars.XROGA_OCI_FEDERATION_DOMAIN }}
          XROGA_OCI_FEDERATION_CLIENT_ID: ${{ vars.XROGA_OCI_FEDERATION_CLIENT_ID }}
          XROGA_OCI_EXCHANGE_CLIENT_SECRET: ${{ secrets.XROGA_OCI_EXCHANGE_CLIENT_SECRET }}
        run: node --import tsx scripts/security/verify-oci-wrong-workflow.ts
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: oci-wrong-workflow-${{ github.sha }}
          path: ${{ runner.temp }}/oci-federation-wrong-workflow.json
          retention-days: 1
          if-no-files-found: error
  health:
    if: inputs.oci_wrong_workflow != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /health
        run: |
          set -o pipefail
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 \
            https://xroga-api.fly.dev/health)
          echo "status=$code"
          echo "--- body (first 2000 bytes) ---"
          head -c 2000 /tmp/health.json || true
          echo
          test "$code" -ge 200 && test "$code" -lt 300

      - name: GET /ready
        run: |
          set -o pipefail
          code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' --max-time 30 \
            https://xroga-api.fly.dev/ready)
          echo "status=$code"
          echo "--- body (first 2000 bytes) ---"
          head -c 2000 /tmp/ready.json || true
          echo
          test "$code" -ge 200 && test "$code" -lt 300
