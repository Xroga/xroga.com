name: Xroga tenant security fixtures
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-policy-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: xb01_tenant_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xb01_tenant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Bind audit inventory to the actual virtual merge
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/prepare-pr-integration.mjs
      - name: Audit integrity and negative scanner fixtures
        run: |
          node scripts/security/audit-tenant-policies.mjs
          node --test scripts/security/audit-tenant-policies.test.mjs scripts/security/caller-reviews.closure.test.mjs
      - name: Credential source inventory and adversarial audit fixtures
        run: |
          node scripts/security/audit-credential-usage.mjs
          node --test scripts/security/audit-credential-usage.test.mjs
      - name: Actual PostgreSQL target-schema fresh and upgrade policy assertions
        env:
          CI: 'true'
          XB01_DISPOSABLE_DATABASE: '1'
          XB01_TENANT_TEST_DATABASE_URL: postgres://postgres:disposable-fixture-only@127.0.0.1:5432/xb01_tenant_test
        run: node --test scripts/security/tenant-rls.database.test.mjs
      - name: Backend context and loopback boundary tests (not live Supabase evidence)
        run: node node_modules/tsx/dist/cli.mjs --test backend/src/security/*.test.ts
      - name: Real immutable egress receipt and dispatch-race database tests
        env:
          XB01_DISPOSABLE_DATABASE: '1'
          XB01_EGRESS_TEST_DATABASE_URL: postgres://postgres:disposable-fixture-only@127.0.0.1:5432/xb01_tenant_test
        run: node node_modules/tsx/dist/cli.mjs --test backend/tests/securityReceipt.local.integration.ts
      - name: Actual container offline install and kernel network denial
        env:
          XB01_SANDBOX_CONTAINER_PROOF: '1'
        run: |
          docker pull node@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
          node node_modules/tsx/dist/cli.mjs --test backend/tests/sandboxNetwork.local.integration.ts
      - name: Preserve exact integrated audit provenance
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tenant-fixture-integration-${{ github.sha }}
          path: artifacts/batch-01-integration/
          if-no-files-found: error
          retention-days: 14
