name: Growth technical publishing

on:
  pull_request:
    paths:
      - 'frontend/src/app/**'
      - 'frontend/src/lib/**'
      - 'frontend/next.config.mjs'
      - 'frontend/redirects.mjs'
      - 'content/manifests/**'
      - 'growth/**'
      - 'scripts/growth-publishing/**'
      - 'scripts/seo-**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/growth-technical-publishing.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src/app/**'
      - 'frontend/src/lib/**'
      - 'frontend/next.config.mjs'
      - 'frontend/redirects.mjs'
      - 'content/manifests/**'
      - 'growth/**'
      - 'scripts/growth-publishing/**'
      - 'scripts/seo-**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/growth-technical-publishing.yml'
  schedule:
    - cron: '29 4 * * 1'
  workflow_dispatch:
    inputs:
      live:
        description: 'Run bounded production retrieval checks'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:growth:technical
      - run: npm run growth:technical:validate -- --json
      - run: npm run growth:changed-urls -- --since=HEAD^ --json
      - run: npm run growth:ship -- --since=HEAD^ --dry-run --json
      - run: npm run build --workspace=frontend

  production-discovery:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify representative production URLs
        run: npm run growth:verify-live -- --base-url=https://xroga.com --json
      - name: Verify feeds
        run: npm run growth:feeds -- --base-url=https://xroga.com --json
      - name: Verify crawler retrieval profiles
        run: npm run growth:crawlers -- --base-url=https://xroga.com --url=/build-with/github --json
      - name: Run bounded public crawl
        run: npm run growth:crawl -- --base-url=https://xroga.com --json
      - name: Upload sanitized receipts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: growth-technical-receipts-${{ github.run_id }}
          path: artifacts/growth-publishing/
          if-no-files-found: ignore
          retention-days: 30
      - name: Open an actionable issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Growth technical publishing verification failed';
            const body = `A bounded production discovery check failed. Inspect ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`;
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            const issue = open.data.find(item => item.title === title);
            if (issue) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
