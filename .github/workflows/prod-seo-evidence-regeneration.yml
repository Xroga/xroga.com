name: One-time production-base SEO evidence regeneration
on:
  push:
    branches:
      - patch/ai-app-seo-from-live-20261104
    paths:
      - .github/workflows/prod-seo-evidence-regeneration.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'Xroga/xroga.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production patch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: patch/ai-app-seo-from-live-20261104
          fetch-depth: 0
      - name: Use repository pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Remove one-time workflow from final source
        run: git rm .github/workflows/prod-seo-evidence-regeneration.yml
      - name: Regenerate and validate source-bound evidence
        run: |
          node scripts/xroga/inventory.mjs
          node scripts/security/audit-egress-callers.mjs --write
          node scripts/xroga/runtime-inventory.mjs
          node scripts/xroga/reconcile-requirements.mjs
          node scripts/xroga/inventory.mjs --check
          node scripts/security/audit-egress-callers.mjs --require-complete
          node scripts/xroga/check-runtime-config.mjs
          node scripts/xroga/validate-requirements-ledger.mjs
      - name: Commit only tracked generated docs and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- docs/xroga
          git diff --cached --stat
          git commit -m "chore: reconcile source evidence for isolated live AI app builder SEO patch"
          git push origin HEAD:patch/ai-app-seo-from-live-20261104
