name: One-time app builder SEO runtime inventory refresh
on:
  push:
    branches:
      - seo/free-ai-app-builder-2026-11
    paths:
      - .github/workflows/seo-runtime-inventory-refresh.yml
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'Xroga/xroga.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: seo/free-ai-app-builder-2026-11
          fetch-depth: 0
      - name: Use pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install frozen dependencies
        run: npm ci
      - name: Remove temporary workflow prior to runtime inventory generation
        run: git rm .github/workflows/seo-runtime-inventory-refresh.yml
      - name: Refresh and validate source-bound runtime evidence
        run: |
          node scripts/xroga/runtime-inventory.mjs
          node scripts/xroga/check-runtime-config.mjs
          node scripts/xroga/inventory.mjs --check
          node scripts/xroga/validate-requirements-ledger.mjs
          node scripts/xroga/validate-golden-journeys.mjs
          node scripts/xroga/mission-check.mjs
          node scripts/security/audit-tenant-policies.mjs
          node scripts/security/audit-egress-callers.mjs --require-complete
          node --test scripts/xroga/runtime-config.test.mjs scripts/xroga/runtime-discovery.test.mjs
      - name: Commit only regenerated docs and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- docs/xroga
          git diff --cached --stat
          git commit -m "chore: refresh runtime discovery after AI app builder copy update"
          git push origin HEAD:seo/free-ai-app-builder-2026-11
