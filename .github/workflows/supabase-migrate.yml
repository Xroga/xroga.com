name: Supabase migration gate

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/apply-supabase-migrations.mjs'
      - 'scripts/lib/**'
      - '.github/workflows/supabase-migrate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/apply-supabase-migrations.mjs'
      - 'scripts/lib/**'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Validate migration sources without production mutation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install frozen validation dependencies
        run: npm ci --workspaces=false
      - name: Verify SQL and migration identifiers on every event
        run: node scripts/ci/validate-migrations.mjs

# The accepted Phase3 cutover applied restore-validated effects without stamping
# historical migration aliases. A merge must not replay that history or create
# fixture users in production. Live SQL remains a separately reviewed operation
# using an actual catalog delta and an isolated restore. Mandatory authenticated
# fresh/upgrade and tenant tests remain in their existing isolated workflows.
