name: One-shot runtime audit for published blog sync
on:
  push:
    branches:
      - sync/blog-editorial-main-20261031
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.actor == 'Xroga'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sync/blog-editorial-main-20261031
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Regenerate and independently validate runtime inventory
        run: |
          set -euo pipefail
          git rm -- .github/workflows/editorial-runtime-one-shot.yml
          node scripts/xroga/runtime-inventory.mjs
          node scripts/xroga/check-runtime-config.mjs
          node scripts/xroga/inventory.mjs --check
          node scripts/xroga/validate-requirements-ledger.mjs
          node scripts/security/audit-egress-callers.mjs --require-complete
      - name: Commit canonical runtime outputs only and self-remove
        run: |
          set -euo pipefail
          git add -u docs/xroga
          git -c user.name='Xroga Audit Bot' -c user.email='noreply@github.com' commit -m 'chore(audit): refresh reviewed runtime inventory after editorial sync'
          git push origin HEAD:sync/blog-editorial-main-20261031
