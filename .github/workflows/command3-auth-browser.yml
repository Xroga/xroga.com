name: Command 3 authenticated browser verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  authenticated-browser:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Headroom for a cold browser cache. The tests themselves finish in well under a minute, and
    # a warm run takes about three; the variable cost is entirely the first download, which the
    # Playwright CDN has served anywhere between 68 seconds and over 28 minutes on the same day.
    # A job cancelled mid-download yields no evidence either way, so the ceiling is sized to let
    # that download finish once and seed the cache rather than to bound a healthy run.
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      E2E_BACKEND_URL: http://127.0.0.1:4000
      # Production billing is verified by launch-production-verification.yml
      # after the merged release SHA is deployed. PR authentication checks must
      # not couple branch validation to the configuration of an older release.
      FRONTEND_URL: http://127.0.0.1:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Safe configuration preflight
        shell: bash
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN; do
            if [ -z "${!name:-}" ]; then echo "missing_required_variable=$name"; exit 1; fi
          done
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://nzenxdfumxrnsmybazmo.supabase.co"
          test "$SUPABASE_URL" = "$NEXT_PUBLIC_SUPABASE_URL"
          case "$NEXT_PUBLIC_SUPABASE_ANON_KEY" in sb_secret_*|"") echo "invalid_public_key_category"; exit 1;; esac
          echo "project_ref=nzenxdfumxrnsmybazmo"
          echo "public_key_present=true"
          echo "service_key_present=true"
      - name: Verify required email authentication provider
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.supabase.com/v1/projects/nzenxdfumxrnsmybazmo/config/auth"
          curl --silent --show-error --fail --output auth-config.json \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$endpoint"
          configured="$(node -e "const c=require('./auth-config.json'); process.stdout.write(String(c.external_email_enabled === true && c.disable_signup === false && c.site_url === 'https://xroga.com' && String(c.uri_allow_list || '').includes('https://xroga.com/auth/callback')))")"
          if [ "$configured" != "true" ]; then
            curl --silent --show-error --fail --output auth-config-updated.json \
              --request PATCH --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"external_email_enabled":true,"disable_signup":false,"site_url":"https://xroga.com","uri_allow_list":"https://xroga.com/auth/callback,http://127.0.0.1:3000/auth/callback"}' "$endpoint"
          fi
          curl --silent --show-error --fail --output auth-config-verified.json \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$endpoint"
          node -e "const c=require('./auth-config-verified.json'); if(c.external_email_enabled !== true || c.disable_signup !== false || c.site_url !== 'https://xroga.com' || !String(c.uri_allow_list || '').includes('https://xroga.com/auth/callback')) process.exit(1)"
          rm -f auth-config.json auth-config-updated.json auth-config-verified.json
          echo "email_authentication_enabled=true"
          echo "public_signup_enabled=true"
          echo "production_callback_allowed=true"
      - name: Install isolated workspace dependencies
        run: |
          npm ci --workspaces=false
          npm ci --prefix backend --workspaces=false
          npm ci --prefix frontend --workspaces=false
      # A spec that does not parse is currently only discovered *after* two production
      # builds and a browser download — several minutes to learn that a file has a
      # syntax error. `--list` compiles every spec and runs none of them, so it reports
      # the same class of failure in seconds. Added because a duplicate `const`
      # declaration reached this workflow and cost two full runs before being seen.
      #
      # The placeholder values exist only so the spec's module-level Supabase client can
      # be constructed while compiling. No request is made and no real secret is needed,
      # which is why they are set here rather than inherited from the job.
      - name: Compile the browser specs
        working-directory: frontend
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-compile-only
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-compile-only
        run: node ../node_modules/@playwright/test/cli.js test e2e/ --list > /dev/null
      - run: npm run build --prefix backend --workspaces=false
      - run: npm run build --prefix frontend --workspaces=false
      # Browser binaries are ~300MB and were re-downloaded on every run. That normally costs a
      # minute or two, but it is a CDN transfer on the critical path of a 20-minute job: two runs
      # of this workflow spent 18+ minutes here and were cancelled mid-download, so the
      # authentication test never executed at all. A cancelled run proves nothing about
      # authentication, which makes this a reliability defect in the check itself.
      #
      # The cache key is the lockfile, so a Playwright upgrade fetches fresh binaries rather than
      # driving a browser the driver was not built against.
      #
      # Restore and save are separate on purpose. `actions/cache` saves only in a *post* step,
      # which is skipped when a job is cancelled — so a download that never finishes inside the
      # budget can never populate the cache that would have prevented the next download. Three
      # consecutive runs died that way. Saving immediately after the install means one completed
      # download is kept, whatever happens to the rest of the job.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Left unconditional on purpose: with the cache warm, Playwright sees the binaries and
      # skips the download, while `--with-deps` still installs the system libraries, which are
      # part of the runner rather than the cache. Skipping this on a cache hit would trade a slow
      # job for a browser that cannot start.
      - run: npx playwright install --with-deps chromium

      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Start isolated application
        shell: bash
        run: |
          PORT=4000 node backend/dist/index.js > backend.log 2>&1 & echo $! > backend.pid
          npm run start --prefix frontend --workspaces=false -- --hostname 127.0.0.1 --port 3000 > frontend.log 2>&1 & echo $! > frontend.pid
          for attempt in $(seq 1 40); do
            curl --silent --fail http://127.0.0.1:4000/ready >/dev/null && curl --silent --fail http://127.0.0.1:3000/auth/login >/dev/null && exit 0
            sleep 2
          done
          echo "application_start_failed"; tail -n 40 backend.log; tail -n 40 frontend.log; exit 1
      - name: Authenticated browser and tenant isolation
        working-directory: frontend
        # Invoke the test package's own CLI so npm's nested workspace install
        # cannot select the transitive playwright binary from another copy.
        run: node ../node_modules/@playwright/test/cli.js test e2e/command3-auth.spec.ts e2e/companion-public.spec.ts
      - name: Upload redacted verification evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: command3-auth-browser-evidence
          path: |
            frontend/test-results/command3-auth-evidence.json
            frontend/test-results/**/test-failed-*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup processes
        if: always()
        shell: bash
        run: |
          test -f frontend.pid && kill "$(cat frontend.pid)" || true
          test -f backend.pid && kill "$(cat backend.pid)" || true
