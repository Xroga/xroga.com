name: Isolated Supabase authenticated browser verification

on:
  workflow_dispatch:
    inputs:
      phase3_library_focus:
        description: 'Run the failing Library scenario first, then the unchanged complete browser suite'
        type: boolean
        default: false
      oci_custody:
        description: 'Approved isolated OCI proof, skips normal browser suite'
        type: choice
        options: ['off', bootstrap, custody]
        default: 'off'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  oci-managed-custody:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Xroga/xroga.com' && github.ref == 'refs/heads/codex/xroga-batch-01' && (inputs.oci_custody == 'bootstrap' || inputs.oci_custody == 'custody')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: xroga-phase3-oci-custody
    concurrency:
      group: xroga-phase3-oci-custody
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      XB01_DISPOSABLE_SUPABASE: '1'
      XROGA_RELEASE_SHA: ${{ github.sha }}
      XROGA_CREDENTIAL_KMS_PROVIDER: oci
      XROGA_OCI_KMS_AUTH_MODE: workload_federation
      XROGA_OCI_FEDERATION_SOURCE: github_actions
      XROGA_OCI_FEDERATION_CLIENT_ID: ${{ vars.XROGA_OCI_FEDERATION_CLIENT_ID }}
      XROGA_OCI_FEDERATION_DOMAIN: ${{ vars.XROGA_OCI_FEDERATION_DOMAIN }}
      XROGA_OCI_FEDERATION_DOMAIN_ID: ${{ vars.XROGA_OCI_FEDERATION_DOMAIN_ID }}
      XROGA_OCI_EXCHANGE_CLIENT_SECRET: ${{ secrets.XROGA_OCI_EXCHANGE_CLIENT_SECRET }}
      XROGA_OCI_KMS_PRINCIPAL_ID: ${{ inputs.oci_custody == 'custody' && vars.XROGA_OCI_KMS_PRINCIPAL_ID || '' }}
      XROGA_OCI_KMS_KEY_ID: ${{ vars.XROGA_OCI_KMS_KEY_ID }}
      XROGA_OCI_KMS_KEY_VERSION: ${{ vars.XROGA_OCI_KMS_KEY_VERSION }}
      XROGA_OCI_KMS_ENDPOINT: ${{ vars.XROGA_OCI_KMS_ENDPOINT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
      - name: Frozen backend dependencies only
        run: |
          npm ci --workspaces=false
          npm ci --prefix backend --workspaces=false
      - name: Discover issued non-user principal without key permission
        if: inputs.oci_custody == 'bootstrap'
        run: node --import tsx scripts/security/verify-oci-federation.ts bootstrap
      - name: Start existing disposable Supabase
        if: inputs.oci_custody == 'custody'
        run: node scripts/security/disposable-supabase.mjs
      - name: Real PostgreSQL fresh and upgrade history
        if: inputs.oci_custody == 'custody'
        run: node scripts/security/full-supabase-history.mjs
      - name: Production-mode canonical backend writer and reader
        if: inputs.oci_custody == 'custody'
        env:
          NODE_ENV: production
        run: node --import tsx scripts/security/verify-oci-federation.ts write
      - name: Separate process persisted-ciphertext recovery
        if: inputs.oci_custody == 'custody'
        env:
          NODE_ENV: production
        run: node --import tsx scripts/security/verify-oci-federation.ts read
      - name: Real short-lived token expiry and unattended renewal
        if: inputs.oci_custody == 'custody'
        env:
          NODE_ENV: production
        run: node --import tsx scripts/security/verify-oci-federation.ts renewal
      - name: Redacted bounded custody receipts only
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: oci-federation-${{ inputs.oci_custody }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/oci-federation-bootstrap.json
            ${{ runner.temp }}/oci-federation-write.json
            ${{ runner.temp }}/oci-federation-read.json
            ${{ runner.temp }}/oci-federation-renewal.json
          retention-days: 1
          if-no-files-found: error
      - name: Dispose local database
        if: always() && inputs.oci_custody == 'custody'
        run: |
          if [ -n "${XB01_SUPABASE_WORKDIR:-}" ]; then
            npx --yes --package=supabase@2.120.0 --package=@supabase/cli-linux-x64@2.120.0 supabase --workdir "$XB01_SUPABASE_WORKDIR" stop --no-backup > /dev/null 2>&1
            node scripts/security/disposable-supabase.mjs --verify-teardown
          fi
  authenticated-browser:
    if: (github.event_name == 'workflow_dispatch' && inputs.oci_custody != 'bootstrap' && inputs.oci_custody != 'custody') || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Headroom for a cold browser cache. The tests themselves finish in well under a minute, and
    # a warm run takes about three; the variable cost is entirely the first download, which the
    # Playwright CDN has served anywhere between 68 seconds and over 28 minutes on the same day.
    # A job cancelled mid-download yields no evidence either way, so the ceiling is sized to let
    # that download finish once and seed the cache rather than to bound a healthy run.
    timeout-minutes: 45
    env:
      XB01_DISPOSABLE_SUPABASE: '1'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      E2E_BACKEND_URL: http://127.0.0.1:4000
      # Production billing is verified by launch-production-verification.yml
      # after the merged release SHA is deployed. PR authentication checks must
      # not couple branch validation to the configuration of an older release.
      FRONTEND_URL: http://127.0.0.1:3000
      NODE_ENV: test
      XB01_TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      XROGA_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_WEB_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install isolated workspace dependencies
        run: |
          npm ci --workspaces=false
          npm ci --prefix backend --workspaces=false
          npm ci --prefix frontend --workspaces=false
      - name: Test disposable environment admission
        run: node --test scripts/security/disposable-supabase.test.mjs
      - name: Start disposable Supabase with per-run keys
        run: node scripts/security/disposable-supabase.mjs
      - name: Full migration history and sanitized upgrade compatibility
        run: node scripts/security/full-supabase-history.mjs
      # A spec that does not parse is currently only discovered *after* two production
      # builds and a browser download — several minutes to learn that a file has a
      # syntax error. `--list` compiles every spec and runs none of them, so it reports
      # the same class of failure in seconds. Added because a duplicate `const`
      # declaration reached this workflow and cost two full runs before being seen.
      #
      # The placeholder values exist only so the spec's module-level Supabase client can
      # be constructed while compiling. No request is made and no real secret is needed,
      # which is why they are set here rather than inherited from the job.
      - name: Compile the browser specs
        working-directory: frontend
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-compile-only
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-compile-only
        run: node ../node_modules/@playwright/test/cli.js test e2e/ --list > /dev/null
      - run: npm run build --prefix backend --workspaces=false
      - run: npm run build --prefix frontend --workspaces=false
      # Browser binaries are ~300MB and were re-downloaded on every run. That normally costs a
      # minute or two, but it is a CDN transfer on the critical path of a 20-minute job: two runs
      # of this workflow spent 18+ minutes here and were cancelled mid-download, so the
      # authentication test never executed at all. A cancelled run proves nothing about
      # authentication, which makes this a reliability defect in the check itself.
      #
      # The cache key is the lockfile, so a Playwright upgrade fetches fresh binaries rather than
      # driving a browser the driver was not built against.
      #
      # Restore and save are separate on purpose. `actions/cache` saves only in a *post* step,
      # which is skipped when a job is cancelled — so a download that never finishes inside the
      # budget can never populate the cache that would have prevented the next download. Three
      # consecutive runs died that way. Saving immediately after the install means one completed
      # download is kept, whatever happens to the rest of the job.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Left unconditional on purpose: with the cache warm, Playwright sees the binaries and
      # skips the download, while `--with-deps` still installs the system libraries, which are
      # part of the runner rather than the cache. Skipping this on a cache hit would trade a slow
      # job for a browser that cannot start.
      - run: npx playwright install --with-deps chromium

      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Start isolated application
        id: start-application
        shell: bash
        run: |
          PORT=4000 node backend/dist/index.js > backend.log 2>&1 & echo $! > backend.pid
          npm run start --prefix frontend --workspaces=false -- --hostname 127.0.0.1 --port 3000 > frontend.log 2>&1 & echo $! > frontend.pid
          for attempt in $(seq 1 40); do
            curl --silent --fail http://127.0.0.1:4000/ready >/dev/null && curl --silent --fail http://127.0.0.1:3000/auth/login >/dev/null && exit 0
            sleep 2
          done
          echo "application_start_failed; raw application logs withheld"; exit 1
      - name: Focused Library authentication and private-file scenario
        if: github.event_name == 'workflow_dispatch' && inputs.phase3_library_focus
        working-directory: frontend
        run: node ../node_modules/@playwright/test/cli.js test e2e/command3-auth.spec.ts --grep '^real Supabase login persists, Operations works, cross-tenant access is denied, and logout clears the session$'
      - name: Affected Library components
        if: github.event_name == 'workflow_dispatch' && inputs.phase3_library_focus
        working-directory: frontend
        run: node --import tsx --test src/components/library/libraryFilePreview.test.ts
      - name: Authenticated browser and tenant isolation
        working-directory: frontend
        # Invoke the test package's own CLI so npm's nested workspace install
        # cannot select the transitive playwright binary from another copy.
        run: node ../node_modules/@playwright/test/cli.js test e2e/command3-auth.spec.ts e2e/companion-public.spec.ts e2e/batch01-founder-local.spec.ts e2e/proxy-origin-local.spec.ts
      - name: Real tenant authorization and concurrency integration
        # Independent evidence still runs after a browser assertion fails, but
        # never against an app that failed readiness; failures remain fatal.
        if: ${{ !cancelled() && steps.start-application.outcome == 'success' }}
        working-directory: backend
        run: node --import tsx --test src/security/tenantIsolation.local.integration.ts
      - name: Collect bounded redacted local application logs
        if: always()
        run: node scripts/security/collect-local-security-logs.mjs
      - name: Upload redacted verification evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: command3-auth-browser-evidence
          path: |
            frontend/test-results/command3-auth-evidence.json
            frontend/test-results/library-selector-evidence.json
            frontend/test-results/batch01-founder-evidence.json
            frontend/test-results/batch01-private-delivery-evidence.json
            frontend/test-results/proxy-origin-evidence.json
            frontend/test-results/**/test-failed-*.png
            artifacts/batch-01-local-security/migration-history.json
            artifacts/batch-01-local-security/schema-catalog.json
            artifacts/batch-01-local-security/supabase-start-redacted.log
            artifacts/batch-01-local-security/*.redacted
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup processes
        if: always()
        shell: bash
        run: |
          test -f frontend.pid && kill "$(cat frontend.pid)" || true
          test -f backend.pid && kill "$(cat backend.pid)" || true
          if [ -n "${XB01_SUPABASE_WORKDIR:-}" ]; then
            npx --yes --package=supabase@2.120.0 --package=@supabase/cli-linux-x64@2.120.0 supabase --workdir "$XB01_SUPABASE_WORKDIR" stop --no-backup > /dev/null 2>&1
            node scripts/security/disposable-supabase.mjs --verify-teardown
          fi
