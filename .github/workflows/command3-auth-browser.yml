name: Command 3 authenticated browser verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  authenticated-browser:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      E2E_BACKEND_URL: http://127.0.0.1:4000
      FRONTEND_URL: http://127.0.0.1:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Safe configuration preflight
        shell: bash
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then echo "missing_required_variable=$name"; exit 1; fi
          done
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://nzenxdfumxrnsmybazmo.supabase.co"
          test "$SUPABASE_URL" = "$NEXT_PUBLIC_SUPABASE_URL"
          case "$NEXT_PUBLIC_SUPABASE_ANON_KEY" in sb_secret_*|"") echo "invalid_public_key_category"; exit 1;; esac
          echo "project_ref=nzenxdfumxrnsmybazmo"
          echo "public_key_present=true"
          echo "service_key_present=true"
      - run: npm ci
      - run: npm run build --workspace=backend
      - run: npm run build --workspace=frontend
      - run: npx playwright install --with-deps chromium
      - name: Start isolated application
        shell: bash
        run: |
          PORT=4000 node backend/dist/index.js > backend.log 2>&1 & echo $! > backend.pid
          npm run start --workspace=frontend -- --hostname 127.0.0.1 --port 3000 > frontend.log 2>&1 & echo $! > frontend.pid
          for attempt in $(seq 1 40); do
            curl --silent --fail http://127.0.0.1:4000/ready >/dev/null && curl --silent --fail http://127.0.0.1:3000/auth/login >/dev/null && exit 0
            sleep 2
          done
          echo "application_start_failed"; tail -n 40 backend.log; tail -n 40 frontend.log; exit 1
      - name: Authenticated browser and tenant isolation
        working-directory: frontend
        run: npx playwright test e2e/command3-auth.spec.ts
      - name: Upload redacted verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command3-auth-browser-evidence
          path: |
            frontend/test-results/command3-auth-evidence.json
            frontend/test-results/**/test-failed-*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup processes
        if: always()
        shell: bash
        run: |
          test -f frontend.pid && kill "$(cat frontend.pid)" || true
          test -f backend.pid && kill "$(cat backend.pid)" || true
