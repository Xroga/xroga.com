name: Production launch browser verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_BASE_URL: https://xroga.com
      E2E_BACKEND_URL: https://xroga-api.fly.dev
      LAUNCH_BILLING_API_URL: https://xroga-api.fly.dev
      EXPECTED_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Safe production preflight
        shell: bash
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then echo "missing_required_variable=$name"; exit 1; fi
          done
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://nzenxdfumxrnsmybazmo.supabase.co"
          case "$NEXT_PUBLIC_SUPABASE_ANON_KEY" in sb_secret_*|"") echo "invalid_public_key_category"; exit 1;; esac
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 https://xroga.com/api/release)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 https://xroga-api.fly.dev/ready)" = "200"
          web_release="$(curl --silent --show-error --max-time 20 https://xroga.com/api/release | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{const r=JSON.parse(b).release;if(!/^[0-9a-f]{40}$/.test(r||''))process.exit(1);process.stdout.write(r)})")"
          git cat-file -e "${web_release}^{commit}"
          git merge-base --is-ancestor "$web_release" "$GITHUB_SHA"
          if ! git diff --quiet "$web_release" "$GITHUB_SHA" -- frontend; then
            echo "frontend_release_does_not_match_current_frontend_tree"
            exit 1
          fi
          echo "EXPECTED_WEB_RELEASE_SHA=$web_release" >> "$GITHUB_ENV"
          github_auth_location="$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}' --max-time 20 \
            "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/authorize?provider=github&redirect_to=https%3A%2F%2Fxroga.com%2Fauth%2Fcallback")"
          case "$github_auth_location" in
            https://github.com/login/oauth/authorize*) ;;
            *) echo "github_social_auth_provider_unavailable"; exit 1;;
          esac
          echo "production_endpoints_reachable=true"
          echo "frontend_artifact_equivalent=true"
          echo "github_social_auth_provider_reachable=true"
      - name: Install browser-test dependencies
        run: |
          npm ci --workspaces=false
          npm ci --prefix frontend --workspaces=false
          npx playwright install --with-deps chromium
      - name: Verify exact production release, authentication, and tenant isolation
        working-directory: frontend
        run: node ../node_modules/@playwright/test/cli.js test e2e/command3-auth.spec.ts e2e/launch-public.spec.ts
      - name: Upload redacted production evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: production-launch-browser-evidence-${{ github.sha }}
          path: |
            frontend/test-results/command3-auth-evidence.json
            frontend/test-results/**/test-failed-*.png
          if-no-files-found: warn
          retention-days: 30
