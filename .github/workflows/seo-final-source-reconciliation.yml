name: One-time app builder SEO final source reconciliation
on:
  push:
    branches:
      - seo/free-ai-app-builder-2026-11
    paths:
      - .github/workflows/seo-final-source-reconciliation.yml
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'Xroga/xroga.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact SEO branch history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: seo/free-ai-app-builder-2026-11
          fetch-depth: 0
      - name: Use pinned repository Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Remove temporary workflow before canonical generation
        run: git rm .github/workflows/seo-final-source-reconciliation.yml
      - name: Refresh and verify canonical inventories and sources
        run: |
          node scripts/xroga/inventory.mjs
          node scripts/security/audit-egress-callers.mjs --write
          node scripts/xroga/reconcile-requirements.mjs
          node scripts/xroga/inventory.mjs --check
          node scripts/security/audit-egress-callers.mjs --require-complete
          node scripts/xroga/validate-requirements-ledger.mjs
          node scripts/xroga/reconcile-requirements.mjs --check
      - name: Commit updated source evidence and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- docs/xroga
          git diff --cached --stat
          git commit -m "chore: reconcile tested AI app builder SEO hero source"
          git push origin HEAD:seo/free-ai-app-builder-2026-11
