name: Frontend production build check

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - 'scripts/enforce-next-postcss.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - 'scripts/enforce-next-postcss.mjs'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and build frontend
        run: |
          npm ci --prefix frontend --workspaces=false
          npm run lint --prefix frontend --workspaces=false
          npm run build --prefix frontend --workspaces=false
