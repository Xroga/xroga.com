name: Frontend production build check

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - 'scripts/enforce-next-postcss.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - 'scripts/enforce-next-postcss.mjs'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install and build frontend
        run: |
          # Shared canonical server-side guest accounting imports the backend
          # Redis client. Use the frozen monorepo install used by Vercel too.
          npm ci
          npm run lint --prefix frontend --workspaces=false
          npm run build --prefix frontend --workspaces=false

  workspace-staging-image:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/workspace-native-openui-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - name: Verify the private Workspace image without a cloud deploy
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          image="workspace-staging-ci:$SOURCE_SHA"
          name="workspace-staging-ci-$SOURCE_SHA"
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker image rm "$image" >/dev/null 2>&1 || true
            rm -f workspace-staging-manifest.json
          }
          trap cleanup EXIT
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { hostedWorkspaceManifest } from './scripts/security/hosted-workspace-staging.mjs';
          writeFileSync('workspace-staging-manifest.json', JSON.stringify(hostedWorkspaceManifest(process.env.SOURCE_SHA, 'sha256:' + 'b'.repeat(64))));
          JS
          docker build -f infra/google/Dockerfile.workspace-staging \
            --build-arg "XROGA_RELEASE_SHA=$SOURCE_SHA" \
            --build-arg WORKSPACE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_fixture \
            -t "$image" .
          docker run -d --name "$name" -p 127.0.0.1:3217:8080 "$image"
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 -sS http://localhost:3217/api/release |
            jq -e --arg sha "$SOURCE_SHA" '.release == $sha'
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:3217/api/phase1/plan)"
          test "$status" = 401
          csp="$(curl -fsS -D - -o /dev/null http://localhost:3217/workspace | grep -i '^content-security-policy:')"
          [[ "$csp" == *dqxnatoessviphudbhei.supabase.co* && "$csp" != *api.xroga.com* ]]
