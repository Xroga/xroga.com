name: One-shot re-audit of published blog sync
on:
  push:
    branches:
      - sync/blog-editorial-main-20261031
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.actor == 'Xroga'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sync/blog-editorial-main-20261031
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Re-audit candidate with one-shot workflow removed from source
        run: |
          set -euo pipefail
          git rm -- .github/workflows/editorial-inventory-one-shot.yml
          node scripts/xroga/inventory.mjs --refresh
          node scripts/security/audit-egress-callers.mjs --write
          node scripts/xroga/inventory.mjs --check
          node scripts/security/audit-egress-callers.mjs --require-complete
      - name: Commit only regenerated tracked inventory files and remove workflow
        run: |
          set -euo pipefail
          git add -u docs/xroga
          git -c user.name='Xroga Audit Bot' -c user.email='noreply@github.com' commit -m 'chore(audit): regenerate source and egress registers for published blog sync'
          git push origin HEAD:sync/blog-editorial-main-20261031
