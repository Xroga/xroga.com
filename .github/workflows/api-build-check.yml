name: API Docker build check

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile.api'
      - 'fly.api.toml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile.api'
      - 'fly.api.toml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build portable API image with exact source identity
        run: docker build -f Dockerfile.api --build-arg XROGA_RELEASE_SHA="$GITHUB_SHA" -t xroga-api:ci .
