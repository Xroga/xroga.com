name: Weekly production SEO audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Crawl production SEO contracts
        env:
          SEO_AUDIT_BASE_URL: https://xroga.com
        run: node scripts/seo-audit.mjs
      - name: Open or update an actionable issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Production SEO audit failed';
            const body = `The scheduled SEO audit failed on ${new Date().toISOString()}. Inspect: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'seo-audit' });
            const issue = existing.data.find(item => item.title === title);
            if (issue) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['seo-audit'] });
