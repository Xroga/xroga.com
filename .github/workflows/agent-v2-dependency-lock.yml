name: Agent V2 dependency lock

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'backend/package.json'
      - 'backend/scripts/cline-git-compat.mjs'
      - 'backend/scripts/security-dependency-patches.mjs'
      - 'scripts/security/dependency-patches.test.mjs'
      - 'backend/vendor/cline/**'
      - 'backend/src/security/clineGitDependency.test.ts'
      - '.github/workflows/agent-v2-dependency-lock.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/scripts/cline-git-compat.mjs'
      - 'backend/scripts/security-dependency-patches.mjs'
      - 'scripts/security/dependency-patches.test.mjs'
      - 'backend/vendor/cline/**'
      - 'backend/src/security/clineGitDependency.test.ts'
      - 'frontend/package-lock.json'
      - 'scripts/ci/**'
      - '.github/workflows/agent-v2-dependency-lock.yml'

permissions:
  contents: read

concurrency:
  group: agent-v2-dependency-lock-main
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Verify committed lockfiles without rewriting them
        run: node scripts/ci/check-lockfile-integrity.mjs

      - name: Verify Agent V2 dependency graph
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const root = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8')
          );

          const backend = JSON.parse(
            fs.readFileSync('backend/package-lock.json', 'utf8')
          );

          const expectedCline = '0.0.82';
          const expectedRootZod = '4.6.5';
          const expectedBackendZod = '3.25.76';

          const rootCline =
            root.packages?.['node_modules/@cline/sdk']?.version;

          const backendCline =
            backend.packages?.['node_modules/@cline/sdk']?.version;

          if (rootCline !== expectedCline) {
            throw new Error(
              `Root lockfile has @cline/sdk ${rootCline ?? 'missing'}; expected ${expectedCline}`
            );
          }

          if (backendCline !== expectedCline) {
            throw new Error(
              `Backend lockfile has @cline/sdk ${backendCline ?? 'missing'}; expected ${expectedCline}`
            );
          }

          const rootZod =
            root.packages?.['node_modules/zod']?.version;

          const backendZod =
            backend.packages?.['node_modules/zod']?.version;

          if (rootZod !== expectedRootZod) {
            throw new Error(
              `Root lockfile has zod ${rootZod ?? 'missing'}; expected ${expectedRootZod}`
            );
          }

          if (backendZod !== expectedBackendZod) {
            throw new Error(
              `Backend standalone lockfile has zod ${backendZod ?? 'missing'}; expected ${expectedBackendZod}`
            );
          }

          const rootPromptRegistry =
            root.packages?.[
              'node_modules/@sap-ai-sdk/prompt-registry'
            ];

          const backendPromptRegistry =
            backend.packages?.[
              'node_modules/@sap-ai-sdk/prompt-registry'
            ];

          if (!rootPromptRegistry) {
            throw new Error(
              'Root lockfile is missing @sap-ai-sdk/prompt-registry'
            );
          }

          if (!backendPromptRegistry) {
            throw new Error(
              'Backend lockfile is missing @sap-ai-sdk/prompt-registry'
            );
          }

          const backendPromptZod =
            backend.packages?.[
              'node_modules/@sap-ai-sdk/prompt-registry/node_modules/zod'
            ]?.version;

          if (
            typeof backendPromptZod !== 'string' ||
            !backendPromptZod.startsWith('4.')
          ) {
            throw new Error(
              `@sap-ai-sdk/prompt-registry resolves Zod ${backendPromptZod ?? 'missing'} in the standalone backend install; expected Zod 4.x`
            );
          }

          console.log(
            [
              `@cline/sdk: ${expectedCline}`,
              `root Zod: ${rootZod}`,
              `backend application Zod: ${backendZod}`,
              `SAP Prompt Registry Zod: ${backendPromptZod}`,
            ].join('\n')
          );
          NODE

      - name: Prove workspace clean install and runtime resolution
        run: |
          set -euo pipefail

          rm -rf \
            node_modules \
            backend/node_modules \
            frontend/node_modules

          npm ci --ignore-scripts
          node backend/scripts/cline-git-compat.mjs --apply
          node backend/scripts/security-dependency-patches.mjs --apply
          node backend/scripts/security-dependency-patches.mjs --check

          cd backend

          node --import tsx --test src/security/clineGitDependency.test.ts src/security/mcpDependency.test.ts

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {
            createRequire,
          } = require('node:module');
          const {
            pathToFileURL,
          } = require('node:url');

          function packageVersionFromEntry(
            entry,
            expectedName
          ) {
            let directory =
              path.dirname(entry);

            while (true) {
              const manifestPath =
                path.join(
                  directory,
                  'package.json'
                );

              if (
                fs.existsSync(
                  manifestPath
                )
              ) {
                const manifest =
                  JSON.parse(
                    fs.readFileSync(
                      manifestPath,
                      'utf8'
                    )
                  );

                if (
                  manifest.name ===
                  expectedName
                ) {
                  return manifest.version;
                }
              }

              const parent =
                path.dirname(
                  directory
                );

              if (
                parent ===
                directory
              ) {
                break;
              }

              directory =
                parent;
            }

            return null;
          }

          const backendRequire =
            createRequire(
              path.join(
                process.cwd(),
                '__xroga_dependency_check.cjs'
              )
            );

          const directZodEntry =
            backendRequire.resolve(
              'zod'
            );

          const backendZod =
            packageVersionFromEntry(
              directZodEntry,
              'zod'
            );

          if (
            backendZod !==
            '3.25.76'
          ) {
            throw new Error(
              `Backend application resolves zod ${backendZod ?? 'missing'}; expected 3.25.76`
            );
          }

          const promptRegistryEntry =
            backendRequire.resolve(
              '@sap-ai-sdk/prompt-registry'
            );

          const promptRegistryRequire =
            createRequire(
              promptRegistryEntry
            );

          const promptZodEntry =
            promptRegistryRequire.resolve(
              'zod'
            );

          const promptZod =
            packageVersionFromEntry(
              promptZodEntry,
              'zod'
            );

          if (
            !promptZod ||
            !promptZod.startsWith(
              '4.'
            )
          ) {
            throw new Error(
              `SAP Prompt Registry resolves zod ${promptZod ?? 'missing'}; expected Zod 4.x`
            );
          }

          console.log(
            `Workspace backend Zod: ${backendZod}`
          );

          console.log(
            `Workspace SAP Prompt Registry Zod: ${promptZod}`
          );

          import(
            pathToFileURL(
              promptRegistryEntry
            ).href
          )
            .then(
              () => {
                console.log(
                  'SAP Prompt Registry import succeeded.'
                );
              }
            )
            .catch(
              (error) => {
                console.error(
                  error
                );

                process.exitCode =
                  1;
              }
            );
          NODE

      - name: Prove standalone backend clean install and runtime resolution
        run: |
          set -euo pipefail

          rm -rf \
            node_modules \
            backend/node_modules \
            frontend/node_modules

          npm ci \
            --ignore-scripts \
            --workspaces=false \
            --prefix backend

          node backend/scripts/cline-git-compat.mjs --apply

          node backend/scripts/security-dependency-patches.mjs --apply
          node backend/scripts/security-dependency-patches.mjs --check

          cd backend

          node --import tsx --test src/security/clineGitDependency.test.ts src/security/mcpDependency.test.ts

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {
            createRequire,
          } = require('node:module');
          const {
            pathToFileURL,
          } = require('node:url');

          function packageVersionFromEntry(
            entry,
            expectedName
          ) {
            let directory =
              path.dirname(entry);

            while (true) {
              const manifestPath =
                path.join(
                  directory,
                  'package.json'
                );

              if (
                fs.existsSync(
                  manifestPath
                )
              ) {
                const manifest =
                  JSON.parse(
                    fs.readFileSync(
                      manifestPath,
                      'utf8'
                    )
                  );

                if (
                  manifest.name ===
                  expectedName
                ) {
                  return manifest.version;
                }
              }

              const parent =
                path.dirname(
                  directory
                );

              if (
                parent ===
                directory
              ) {
                break;
              }

              directory =
                parent;
            }

            return null;
          }

          const backendRequire =
            createRequire(
              path.join(
                process.cwd(),
                '__xroga_dependency_check.cjs'
              )
            );

          const directZodEntry =
            backendRequire.resolve(
              'zod'
            );

          const backendZod =
            packageVersionFromEntry(
              directZodEntry,
              'zod'
            );

          if (
            backendZod !==
            '3.25.76'
          ) {
            throw new Error(
              `Standalone backend resolves zod ${backendZod ?? 'missing'}; expected 3.25.76`
            );
          }

          const promptRegistryEntry =
            backendRequire.resolve(
              '@sap-ai-sdk/prompt-registry'
            );

          const promptRegistryRequire =
            createRequire(
              promptRegistryEntry
            );

          const promptZodEntry =
            promptRegistryRequire.resolve(
              'zod'
            );

          const promptZod =
            packageVersionFromEntry(
              promptZodEntry,
              'zod'
            );

          if (
            !promptZod ||
            !promptZod.startsWith(
              '4.'
            )
          ) {
            throw new Error(
              `Standalone SAP Prompt Registry resolves zod ${promptZod ?? 'missing'}; expected Zod 4.x`
            );
          }

          console.log(
            `Standalone backend Zod: ${backendZod}`
          );

          console.log(
            `Standalone SAP Prompt Registry Zod: ${promptZod}`
          );

          import(
            pathToFileURL(
              promptRegistryEntry
            ).href
          )
            .then(
              () => {
                console.log(
                  'Standalone SAP Prompt Registry import succeeded.'
                );
              }
            )
            .catch(
              (error) => {
                console.error(
                  error
                );

                process.exitCode =
                  1;
              }
            );
          NODE

      - name: Upload verified committed lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: agent-v2-lockfiles
          path: |
            package-lock.json
            backend/package-lock.json
          if-no-files-found: error
          retention-days: 7
