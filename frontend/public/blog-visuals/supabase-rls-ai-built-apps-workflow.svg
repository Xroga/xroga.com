<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="Supabase RLS security: three-stage educational diagram"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111D2B"/><stop offset="1" stop-color="#130F1C"/></linearGradient><pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#73849D" opacity=".16"/></pattern></defs><rect width="1400" height="800" fill="url(#bg)"/><rect width="1400" height="800" fill="url(#grid)"/><rect x="45" y="45" width="1310" height="710" rx="30" fill="none" stroke="#475773"/><text x="90" y="95" fill="#C7B5FB" font-family="Arial" font-size="21" letter-spacing="4" font-weight="bold">PRACTICAL PROCESS</text><text x="90" y="185" font-family="Arial,sans-serif" font-size="56" font-weight="800" fill="#F1F3FA">Supabase RLS security</text><text x="90" y="325" fill="#A6B6C8" font-family="Arial" font-size="23">Follow each stage and verify the outcome</text><g transform="translate(88 380)"><rect width="390" height="215" rx="24" fill="#1C2331" stroke="#46556A"/><circle cx="65" cy="70" r="33" fill="#C7B5FB" opacity=".22"/><text x="65" y="81" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#C7B5FB">1</text><text x="28" y="137" font-family="Arial" font-size="26" font-weight="bold" fill="#E5EAF6">Identify user scope</text><path d="M28 169 H340" stroke="#C7B5FB" opacity=".45"/></g><g transform="translate(508 380)"><rect width="390" height="215" rx="24" fill="#1C2331" stroke="#46556A"/><circle cx="65" cy="70" r="33" fill="#C7B5FB" opacity=".22"/><text x="65" y="81" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#C7B5FB">2</text><text x="28" y="137" font-family="Arial" font-size="26" font-weight="bold" fill="#E5EAF6">Enforce policies</text><path d="M28 169 H340" stroke="#C7B5FB" opacity=".45"/></g><g transform="translate(928 380)"><rect width="390" height