<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Self-hosted procedural equivalent of the founder's animated noise-mask texture. -->
  <filter id="noise" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="11" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="discrete" tableValues="0 0 0.08 0.2 0.48 0.75 1" />
    </feComponentTransfer>
  </filter>
  <rect x="0" y="0" width="256" height="256" fill="#fff" filter="url(#noise)" />
</svg>
